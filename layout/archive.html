{{> header }}
<main class="page">
  <h1 class="page-title">{{ t.archive.title }}</h1>
  <p class="page-subtitle">{{@ t "archive.subtitle" site.posts.length }}</p>
  {{#each site.archives }}
  <section class="archive-group">
    <h2 class="archive-year">{{ name }}</h2>
    <ul class="archive-list">
      {{#each posts }}
      <li class="archive-item">
        <time datetime="{{ meta.date }}">{{@ formatDate meta.date "MM-DD" }}</time>
        <a href="{{ url }}">{{ meta.title }}</a>
      </li>
      {{/each }}
    </ul>
  </section>
  {{/each }}
</main>
{{> sidebar }}
{{> footer }}
