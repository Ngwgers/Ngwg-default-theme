name: pacific
version: 0.1.0
description: "Ngwg default theme — quiet, cold and simple, like the Pacific."
per_page: 10
# language used when the user sets neither `language` (ngwg.yaml) nor $NGWG_LANG —
# must match an i18n/<lang>.yaml file name
default_language: zh_CN
plugins:
  optional:
    seo: https://github.com/Ngwgers/Ngwg-ext-seo.git
layouts:
  index: index
  post: post
  page: page
  archive: archive
  tag: tag
  category: category
