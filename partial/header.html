<!DOCTYPE html>
<html lang="{{ langAttr }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{#if page.meta.title }}{{ page.meta.title }} · {{/if }}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="/assets/style.css">
  {{#if @ size site.extra.seo }}{{{ @ seoMeta page site }}}{{/if }}
  {{#if site.extra.seo.generateRSS }}<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.extra.seo.rssPath }}">{{/if }}
</head>
<body>
<header class="site-header">
  <nav class="site-nav">
    <a class="site-title" href="/">{{ site.title }}</a>
    <button class="nav-toggle" type="button" aria-label="{{ t.aria.menu }}" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="site-links">
      <a href="/">{{ t.nav.home }}</a>
      <a href="/archives/">{{ t.nav.archives }}</a>
      <a href="/about/">{{ t.nav.about }}</a>
    </div>
  </nav>
</header>
<div class="layout">
