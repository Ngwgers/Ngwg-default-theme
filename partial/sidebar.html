<aside class="sidebar">
  <nav class="toc side-block" id="toc" hidden>
    <div class="toc-head">
      <h2 class="side-title">{{ t.sidebar.toc }}</h2>
      <button class="toc-toggle" type="button" aria-expanded="true" aria-label="{{ t.aria.collapse_toc }}"><span class="toc-chevron"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 2 L9 2 L5 8 Z" fill="currentColor"/></svg></span></button>
    </div>
    <div class="collapse">
      <ul class="toc-list"></ul>
    </div>
    <div class="toc-loading" hidden aria-hidden="true"><span></span><span></span><span></span></div>
  </nav>
  <button class="toc-fab" type="button" aria-label="{{ t.aria.toc }}" aria-expanded="false" hidden>
    <span></span><span></span><span></span>
  </button>
  {{#if @ size site.tags }}
  <section class="side-block collapsible">
    <h2 class="side-title">
      <button type="button" class="side-toggle" aria-expanded="true">{{ t.sidebar.tags }}<span class="side-chevron"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 2 L9 2 L5 8 Z" fill="currentColor"/></svg></span></button>
    </h2>
    <div class="collapse">
      <ul class="side-list">
        {{#each site.tags }}
        <li>
          <a href="/tags/{{@ slugify @key }}/">#{{ @key }}</a>
          <span class="side-count">{{@ size . }}</span>
        </li>
        {{/each }}
      </ul>
    </div>
  </section>
  {{/if }}
  {{#if @ size site.categories }}
  <section class="side-block collapsible">
    <h2 class="side-title">
      <button type="button" class="side-toggle" aria-expanded="true">{{ t.sidebar.categories }}<span class="side-chevron"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 2 L9 2 L5 8 Z" fill="currentColor"/></svg></span></button>
    </h2>
    <div class="collapse">
      <ul class="side-list">
        {{#each site.categories }}
        <li>
          <a href="/categories/{{@ slugify @key }}/">/{{ @key }}</a>
          <span class="side-count">{{@ size . }}</span>
        </li>
        {{/each }}
      </ul>
    </div>
  </section>
  {{/if }}
</aside>
